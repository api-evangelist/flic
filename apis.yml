name: Flic
description: >-
  Flic (Shortcut Labs) makes wireless smart buttons and dials — the Flic Button,
  Flic Twist, Flic Duo, and the Flic Hub — that let people control smart-home
  devices, lights, music, and cloud services with a single press. Its developer
  surface is SDK- and protocol-centric rather than a REST API: first-party
  flic2lib SDKs for iOS, Android, C, Linux, and Windows implement the open Flic 2
  Bluetooth protocol, the Flic Hub SDK runs JavaScript modules (MQTT, OSC) on the
  hub, and "Cloud Buttons" deliver physical button presses to any HTTP endpoint
  as a signed-JWT webhook. Flic is backed by 500 Global and lists 1,000+
  compatible devices and services across smart home, healthcare, retail,
  hospitality, and logistics.
