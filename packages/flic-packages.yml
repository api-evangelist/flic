notes: >-
  Flic is a smart-button hardware company. Its developer surface is SDK- and
  protocol-centric (BLE / Flic 2 protocol) rather than a REST API. All
  first-party client libraries are published under the 50ButtonsEach GitHub
  organization. pyflic on PyPI is a community mirror (not first-party).
packages:
